name: AGPL boundary check

# NOTE: kept as "AGPL boundary check" (workflow name unchanged) so any
# branch protection rule already configured against this check name keeps
# working. This is no longer enforcing a legal/licensing boundary — both
# ephemeris-service and panchanga-core are AGPL-3.0 and public now (see
# docs/product-plan.md §11). This check is retained purely as an
# architecture/style guard to keep this repo talking to Swiss Ephemeris
# only via EphemerisClient, not as a direct import.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  forbidden-imports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for Swiss Ephemeris imports/files
        run: |
          set -e
          if grep -RIiE "import swisseph|import pyswisseph|from swisseph" --include="*.py" --exclude-dir=".git" .; then
            echo "::error::Found a Swiss Ephemeris import in panchanga-core."
            echo "This repo must only call ephemeris-service over HTTP via EphemerisClient."
            exit 1
          fi
          if find . -iname "*.se1" | grep -q .; then
            echo "::error::Found Swiss Ephemeris data file(s) (.se1) in panchanga-core."
            exit 1
          fi
          echo "OK: no Swiss Ephemeris imports or data files found."
